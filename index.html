<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>XAUUSD AI Trading</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { dark: '#0f172a', panel: '#1e293b', gold: '#FFD700' } },
                    padding: { 'safe': 'env(safe-area-inset-bottom)' }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overscroll-behavior-y: none; 
            -webkit-tap-highlight-color: transparent;
        }
        .tab-content {
            display: none;
            height: calc(100vh - 140px); /* Adjust for header and bottom nav */
            overflow-y: auto;
            padding-bottom: 20px;
        }
        .tab-content.active {
            display: block;
        }
        .glass-nav {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="fixed inset-0 flex flex-col bg-brand-dark text-white w-full h-full">

    <!-- Header -->
    <header class="w-full bg-brand-dark border-b border-gray-800 pt-safe shrink-0">
        <div class="flex justify-between items-center px-4 py-3">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-chart-line text-brand-gold text-xl"></i>
                <h1 class="text-lg font-bold text-white">XAUUSD <span class="text-brand-gold">PRO</span></h1>
            </div>
            <div class="flex items-center space-x-2 bg-gray-800 px-3 py-1 rounded-full">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <span class="text-xs font-medium text-green-400">LIVE</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full relative">

        <!-- TAB 1: CHART -->
        <div id="tab-chart" class="tab-content active w-full h-full">
            <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
                <div id="tradingview_xauusd" style="height: 100%; width: 100%;"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript">
                new TradingView.widget({
                    "autosize": true,
                    "symbol": "OANDA:XAUUSD",
                    "interval": "15",
                    "timezone": "Asia/Riyadh",
                    "theme": "dark",
                    "style": "1",
                    "locale": "ar",
                    "enable_publishing": false,
                    "backgroundColor": "#0f172a",
                    "gridColor": "#1e293b",
                    "hide_top_toolbar": false,
                    "container_id": "tradingview_xauusd"
                });
                </script>
            </div>
        </div>

        <!-- TAB 2: NEWS -->
        <div id="tab-news" class="tab-content w-full h-full px-2 pt-2">
            <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
                <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
                {
                    "colorTheme": "dark",
                    "isTransparent": true,
                    "width": "100%",
                    "height": "100%",
                    "locale": "ar_AE",
                    "importanceFilter": "-1,0,1",
                    "currencyFilter": "USD"
                }
                </script>
            </div>
        </div>

        <!-- TAB 3: AI PREDICTION -->
        <div id="tab-ai" class="tab-content w-full h-full px-4 pt-4">
            <div class="bg-brand-panel rounded-2xl p-5 border border-indigo-900 shadow-lg mb-6">
                <!-- API Key Input -->
                <div class="mb-5 bg-gray-900 p-3 rounded-xl border border-gray-700">
                    <label class="block text-xs text-gray-400 mb-2" dir="rtl">
                        <i class="fa-solid fa-key text-brand-gold mr-1"></i> مفتاح Gemini API (مطلوب للتحليل)
                    </label>
                    <input type="password" id="api-key-input" placeholder="ضع مفتاح API هنا..." class="w-full bg-gray-800 border border-gray-600 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500 mb-2" dir="ltr">
                    <button onclick="saveApiKey()" class="w-full bg-gray-700 text-white text-xs py-2 rounded-lg font-bold active:bg-gray-600">حفظ المفتاح محلياً</button>
                    <p class="text-[10px] text-gray-500 mt-2 text-center" dir="rtl">سيتم حفظ المفتاح في متصفح هاتفك فقط ولن يتم إرساله لأي جهة أخرى.</p>
                </div>

                <div class="flex flex-col items-center">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center mb-4">
                        <i class="fa-solid fa-brain text-2xl text-white"></i>
                    </div>
                    <h2 class="text-lg font-bold text-white mb-4 text-center" dir="rtl">تنبؤ أسعار الذهب (الذكاء الاصطناعي)</h2>
                    
                    <button id="btn-analyze" onclick="analyzeMarketWithAI()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition-transform flex items-center justify-center space-x-2">
                        <span dir="rtl">حلل السوق الآن</span>
                        <i class="fa-solid fa-bolt text-brand-gold"></i>
                    </button>

                    <!-- Loading -->
                    <div id="ai-loading" class="hidden w-full mt-6 flex-col items-center">
                        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-400 mb-3"></i>
                        <p class="text-sm text-indigo-300 animate-pulse" dir="rtl">جاري دراسة البيانات...</p>
                    </div>

                    <!-- Result -->
                    <div id="ai-result" class="hidden w-full mt-6 p-4 rounded-xl border transition-all duration-300">
                        <h3 id="ai-direction-text" class="text-3xl font-black text-center mb-3"></h3>
                        <div class="w-full h-px bg-gray-700 my-3"></div>
                        <p id="ai-reason-text" class="text-sm text-gray-200 text-right leading-relaxed" dir="rtl"></p>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="w-full glass-nav z-50 pb-safe shrink-0 h-[70px]">
        <div class="flex justify-around items-center h-full px-2">
            <button onclick="switchTab('chart')" id="btn-chart" class="nav-btn active text-brand-gold flex flex-col items-center justify-center w-full h-full transition-colors duration-200">
                <i class="fa-solid fa-chart-candlestick text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Chart</span>
            </button>
            <button onclick="switchTab('news')" id="btn-news" class="nav-btn text-gray-500 flex flex-col items-center justify-center w-full h-full transition-colors duration-200">
                <i class="fa-solid fa-newspaper text-xl mb-1"></i>
                <span class="text-[10px] font-medium">News</span>
            </button>
            <button onclick="switchTab('ai')" id="btn-ai" class="nav-btn text-gray-500 flex flex-col items-center justify-center w-full h-full transition-colors duration-200">
                <i class="fa-solid fa-brain text-xl mb-1"></i>
                <span class="text-[10px] font-medium">AI Predict</span>
            </button>
        </div>
    </nav>

    <!-- Scripts -->
    <script>
        // Load API key on start
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('xauusd_gemini_api_key');
            if (savedKey) {
                document.getElementById('api-key-input').value = savedKey;
            }
        });

        // Tab Switching
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-brand-gold');
                btn.classList.add('text-gray-500');
            });

            document.getElementById('tab-' + tabId).classList.add('active');
            
            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.remove('text-gray-500');
            activeBtn.classList.add('text-brand-gold');
        }

        // Save API Key
        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if(!key) {
                alert("يرجى إدخال المفتاح أولاً!");
                return;
            }
            localStorage.setItem('xauusd_gemini_api_key', key);
            
            const btn = document.querySelector('button[onclick="saveApiKey()"]');
            const originalText = btn.innerText;
            btn.innerText = "تم الحفظ بنجاح ✓";
            btn.classList.replace('bg-gray-700', 'bg-green-600');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace('bg-green-600', 'bg-gray-700');
            }, 2000);
        }

        // AI Prediction Logic
        async function analyzeMarketWithAI() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            if (!apiKey) {
                alert("يجب إدخال مفتاح Gemini API وحفظه لكي يعمل الذكاء الاصطناعي.");
                return;
            }

            const btn = document.getElementById('btn-analyze');
            const loading = document.getElementById('ai-loading');
            const resultBox = document.getElementById('ai-result');
            const dirText = document.getElementById('ai-direction-text');
            const reasonText = document.getElementById('ai-reason-text');

            btn.style.display = 'none';
            resultBox.classList.add('hidden');
            loading.classList.remove('hidden');
            loading.classList.add('flex');

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            const prompt = `أنت خبير اقتصادي في تداول الذهب (XAUUSD). حلل السوق حالياً وأعطني توقعك.
يجب أن يكون ردك بصيغة JSON فقط بهذا الشكل:
{
  "direction": "UP", // أو "DOWN"
  "reason": "سبب مختصر باللغة العربية يشرح التوقع"
}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: "application/json" }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    throw new Error("تأكد من صحة مفتاح API الخاص بك.");
                }

                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0) {
                    const aiData = JSON.parse(result.candidates[0].content.parts[0].text);
                    
                    if(aiData.direction === "UP") {
                        dirText.innerHTML = 'راح يرتفع <i class="fa-solid fa-arrow-trend-up"></i>';
                        dirText.className = "text-3xl font-black text-center mb-3 text-green-500";
                        resultBox.className = "w-full mt-6 p-4 rounded-xl border border-green-800 bg-green-900/20 block";
                    } else {
                        dirText.innerHTML = 'راح يهبط <i class="fa-solid fa-arrow-trend-down"></i>';
                        dirText.className = "text-3xl font-black text-center mb-3 text-red-500";
                        resultBox.className = "w-full mt-6 p-4 rounded-xl border border-red-800 bg-red-900/20 block";
                    }
                    
                    reasonText.innerText = aiData.reason;
                }
            } catch (error) {
                console.error(error);
                dirText.innerText = "حدث خطأ";
                dirText.className = "text-xl font-bold text-center mb-3 text-gray-400";
                reasonText.innerText = error.message || "فشل الاتصال بالذكاء الاصطناعي، تأكد من صحة مفتاح API والإنترنت.";
                resultBox.className = "w-full mt-6 p-4 rounded-xl border border-gray-700 bg-gray-800 block";
            } finally {
                loading.classList.remove('flex');
                loading.classList.add('hidden');
                btn.style.display = 'flex';
                btn.innerHTML = '<span dir="rtl">تحديث التحليل</span><i class="fa-solid fa-arrows-rotate ml-2"></i>';
            }
        }
    </script>
</body>
</html>
